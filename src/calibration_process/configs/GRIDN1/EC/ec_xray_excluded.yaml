version: GRIDN1/EC
branch: ec_xray
reason: >-
  The 260129 low-energy X-ray root (15/20/25/30/35 keV) has no ch0 file, so a
  positional science_files list can only be written with an empty ch0 slot.
  An empty string cannot be told apart from a real relative path and resolves
  to the data dir, so these five measurements are removed from the formal
  execution manifest (ec_xray_manifest.yaml) rather than carried as a
  placeholder that could shift ch1/ch2/ch3 into the wrong channel. They are
  also excluded from the formal E-C fit: the peaks are threshold-dominated and
  the cross-channel background subtraction leaves a large negative dip at the
  threshold, making the ch2/ch3 centres unstable (redchi often > 10, sigma at a
  bound). The files below are kept for inventory only. Do not re-add them to
  ec_xray_manifest.yaml without resolving the missing ch0 slot explicitly.
