version: GRIDN1/EC
tb:
  reader: n1
  bin_width: 4
  adc_max: 16384.0
  science_dir: raw_data
  fit_range_file: fit_range_tb.yaml
  channels:
  - 0
  - 1
  - 2
  - 3
ec:
  reader: n1wf
  bin_width: 4
  adc_max: 16384.0
  x_path: ec_xray
  x_path_low: ec_xray_low
  xray_reader_low: n1
  src_path: ec_src
  # Gd K edge dead zone for the GAGG channels (piecewise form)
  energy_split_low: 49.0
  energy_split_high: 55.0
  tb_ref_path: single_process/merged_tb.json
  fit_range_file: fit_range_ec_xray.yaml
  energy_map:
    Cs137C-30m-208.event.dat: 662.0
    Cs137C-90m-208.event.dat: 662.0
    Co60C-70m-209.event.dat: 1332.0
    Co60C-40m-209.event.dat: 1173.0
    '15': 15.0
    '20': 20.0
    '25': 25.0
    '30': 30.0
    '35': 35.0
    '40': 40.0
    '45': 45.0
    '47': 47.0
    '49': 49.0
    '51': 51.0
    '53': 53.0
    '55': 55.0
    '60': 60.0
    '65': 65.0
    '70': 70.0
    '75': 75.0
    '80': 80.0
    '90': 90.0
  channel_count: 4
  # CLYC channels (ch0/ch3) have no K edge and only Cs-137/Co-60 anchors left,
  # so use a single line; GAGG (ch1/ch2) keeps the split quadratic.
  ec_form:
    '0': linear
    '1': piecewise_quadratic
    '2': piecewise_quadratic
    '3': linear
  resolution_method: polyfit_nn
  src_reader: n1
  rate_span: channel
  xray_bkg_rotation: fixed
  xray_require_fit_range: true
